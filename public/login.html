<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binion's — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>

  :root{
    --felt-dark:   #0a2b1f;
    --felt:        #103a2a;
    --felt-light:  #175038;
    --rail:        #4a2a18;
    --rail-dark:   #331c0f;
    --gold:        #c8a24d;
    --gold-bright: #e6c576;
    --gold-dim:    #8a723c;
    --cream:       #efe4c8;
    --cream-dim:   #cdbf9c;
    --wine:        #7a2230;
    --wine-bright: #a53344;
    --ink:         #061510;
    --shadow:      rgba(0,0,0,.55);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background: var(--ink);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .table-bg{
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(230,197,118,.10), transparent 60%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 5px),
      radial-gradient(ellipse 140% 90% at 50% 20%, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
  }

  a{ color: inherit; text-decoration: none; }

  /* ---------- layout ---------- */

  .scene{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
  }

  .card{
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- fall-in animation ----------
     Everything starts above the viewport and drops into place,
     one single orchestrated sequence, each piece landing slightly
     after the one before it — like cards dealt onto the table. */

  .fall{
    opacity: 0;
    transform: translateY(-140px);
    animation: fall .85s cubic-bezier(.22, .9, .3, 1.2) forwards;
  }

  @keyframes fall{
    0%   { opacity: 0; transform: translateY(-140px); }
    60%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0); }
  }

  .fall:nth-child(1){ animation-delay: .05s; }

  .brand-mark{
    width: 46px; height: 46px;
    border: 3px solid var(--gold);
    border-radius: 50%;
    border-bottom-color: transparent;
    transform: rotate(-20deg);
    margin-bottom: 14px;
  }
  .fall.brand-mark{ animation-delay: .05s; }

  .brand-name{
    font-family: 'Rye', serif;
    font-size: 32px;
    color: var(--gold-bright);
    text-shadow: 0 2px 0 rgba(0,0,0,.4), 0 0 18px rgba(230,197,118,.2);
    animation-delay: .18s;
  }

  .brand-sub{
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--cream-dim);
    margin-top: 4px;
    margin-bottom: 34px;
    animation-delay: .3s;
  }

  .panel{
    width: 100%;
    background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.22));
    border: 1px solid rgba(200,162,77,.28);
    border-radius: 6px;
    padding: 34px 30px 28px;
    box-shadow: 0 18px 40px var(--shadow);
    animation-delay: .42s;
  }

  .panel h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--cream);
    margin: 0 0 4px;
    text-align: center;
  }

  .panel .lede{
    text-align: center;
    font-size: 13px;
    color: var(--cream-dim);
    margin: 0 0 26px;
  }

  .field{
    margin-bottom: 18px;
  }

  .field label{
    display: block;
    font-size: 12px;
    letter-spacing: .5px;
    color: var(--gold-dim);
    margin-bottom: 7px;
  }

  .field input{
    width: 100%;
    padding: 12px 14px;
    background: rgba(0,0,0,.28);
    border: 1px solid rgba(200,162,77,.3);
    border-radius: 4px;
    color: var(--cream);
    font-size: 14.5px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color .15s ease, background .15s ease;
  }

  .field input::placeholder{ color: rgba(205,191,156,.4); }

  .field input:focus{
    border-color: var(--gold);
    background: rgba(0,0,0,.4);
  }

  .row-between{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -4px 0 22px;
    font-size: 12.5px;
  }

  .remember{
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--cream-dim);
  }

  .remember input{ accent-color: var(--gold); }

  .row-between a{
    color: var(--gold-dim);
    border-bottom: 1px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  .row-between a:hover{ color: var(--gold-bright); border-color: var(--gold-dim); }

  .cta{
    display: block;
    width: 100%;
    text-align: center;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 16.5px;
    letter-spacing: .3px;
    color: var(--ink);
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    padding: 13px 0;
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .cta:hover{
    transform: translateY(-2px);
    box-shadow: 0 14px 26px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5);
  }

  .divider{
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
    color: var(--cream-dim);
    font-size: 11px;
    letter-spacing: 1px;
  }
  .divider::before, .divider::after{
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(200,162,77,.2);
  }

  .signup{
    text-align: center;
    font-size: 13px;
    color: var(--cream-dim);
    animation-delay: .54s;
  }

  .signup a{
    color: var(--gold-bright);
    font-weight: 600;
    border-bottom: 1px solid var(--gold-dim);
  }

  @media (prefers-reduced-motion: reduce){
    .fall{ animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

  <div class="table-bg"></div>

  <div class="scene">
    <div class="card">
      <div class="brand-mark fall" aria-hidden="true"></div>
      <div class="brand-name fall">Binion's</div>
      <div class="brand-sub fall">SALON DE POKER</div>

      <div class="panel fall">
        <h1>Reprenez place à la table</h1>
        <p class="lede">Connectez-vous pour retrouver votre tapis</p>

        <form>
          <div class="field">
            <label for="pseudo">Pseudo</label>
            <input type="text" id="pseudo" name="pseudo" placeholder="PokerFace_88" autocomplete="username">
          </div>

          <div class="field">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
          </div>

          <div class="row-between">
            <label class="remember">
              <input type="checkbox" id="remember">
              Se souvenir de moi
            </label>
            <a href="#mdp-oublie">Mot de passe oublié ?</a>
          </div>

          <button type="submit" class="cta">Se connecter</button>
        </form>

        <div class="divider">OU</div>

        <p class="signup" style="margin:0;">
          Pas encore de compte ? <a href="#creer-compte">Créez-en un</a>
        </p>
      </div>

      <p class="signup fall" style="margin-top:22px;">
        BINION'S · ÉTABLI EN 1951
      </p>
    </div>
  </div>

</body>
</html>
