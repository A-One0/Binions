<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binion's — Créer un compte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>

  :root{
    --felt-dark:   #0a2b1f;
    --felt:        #103a2a;
    --felt-light:  #175038;
    --rail:        #4a2a18;
    --rail-dark:   #331c0f;
    --gold:        #c8a24d;
    --gold-bright: #e6c576;
    --gold-dim:    #8a723c;
    --cream:       #efe4c8;
    --cream-dim:   #cdbf9c;
    --wine:        #7a2230;
    --wine-bright: #a53344;
    --ink:         #061510;
    --shadow:      rgba(0,0,0,.55);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background: var(--ink);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .table-bg{
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(230,197,118,.10), transparent 60%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 5px),
      radial-gradient(ellipse 140% 90% at 50% 20%, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
  }

  a{ color: inherit; text-decoration: none; }

  /* ---------- layout ---------- */

  .scene{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
  }

  .card{
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- fall-in animation ---------- */

  .fall{
    opacity: 0;
    transform: translateY(-140px);
    animation: fall .85s cubic-bezier(.22, .9, .3, 1.2) forwards;
  }

  @keyframes fall{
    0%   { opacity: 0; transform: translateY(-140px); }
    60%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0); }
  }

  .fall:nth-child(1){ animation-delay: .05s; }

  .brand-mark{
    width: 46px; height: 46px;
    border: 3px solid var(--gold);
    border-radius: 50%;
    border-bottom-color: transparent;
    transform: rotate(-20deg);
    margin-bottom: 14px;
  }
  .fall.brand-mark{ animation-delay: .05s; }

  .brand-name{
    font-family: 'Rye', serif;
    font-size: 32px;
    color: var(--gold-bright);
    text-shadow: 0 2px 0 rgba(0,0,0,.4), 0 0 18px rgba(230,197,118,.2);
    animation-delay: .18s;
  }

  .brand-sub{
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--cream-dim);
    margin-top: 4px;
    margin-bottom: 34px;
    animation-delay: .3s;
  }

  .panel{
    width: 100%;
    background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.22));
    border: 1px solid rgba(200,162,77,.28);
    border-radius: 6px;
    padding: 34px 30px 28px;
    box-shadow: 0 18px 40px var(--shadow);
    animation-delay: .42s;
  }

  .panel h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--cream);
    margin: 0 0 4px;
    text-align: center;
  }

  .panel .lede{
    text-align: center;
    font-size: 13px;
    color: var(--cream-dim);
    margin: 0 0 26px;
  }

  .field{
    margin-bottom: 18px;
  }

  .field label{
    display: block;
    font-size: 12px;
    letter-spacing: .5px;
    color: var(--gold-dim);
    margin-bottom: 7px;
  }

  .field label .req{
    color: var(--wine-bright);
  }

  .field input{
    width: 100%;
    padding: 12px 14px;
    background: rgba(0,0,0,.28);
    border: 1px solid rgba(200,162,77,.3);
    border-radius: 4px;
    color: var(--cream);
    font-size: 14.5px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color .15s ease, background .15s ease;
  }

  .field input::placeholder{ color: rgba(205,191,156,.4); }

  .field input:focus{
    border-color: var(--gold);
    background: rgba(0,0,0,.4);
  }

  .field .hint{
    font-size: 11px;
    color: var(--cream-dim);
    margin-top: 6px;
  }

  .terms{
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: -4px 0 22px;
    font-size: 12px;
    color: var(--cream-dim);
    line-height: 1.5;
  }

  .terms input{
    accent-color: var(--gold);
    margin-top: 2px;
  }

  .terms a{
    color: var(--gold-dim);
    border-bottom: 1px solid var(--gold-dim);
  }
  .terms a:hover{ color: var(--gold-bright); }

  .cta{
    display: block;
    width: 100%;
    text-align: center;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 16.5px;
    letter-spacing: .3px;
    color: var(--ink);
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    padding: 13px 0;
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .cta:hover{
    transform: translateY(-2px);
    box-shadow: 0 14px 26px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5);
  }

  .divider{
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
    color: var(--cream-dim);
    font-size: 11px;
    letter-spacing: 1px;
  }
  .divider::before, .divider::after{
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(200,162,77,.2);
  }

  /* ---------- google button ---------- */

  .google-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--cream);
    padding: 11px 0;
    border: 1px solid rgba(0,0,0,.1);
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(0,0,0,.3);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }

  .google-btn:hover{
    transform: translateY(-2px);
    background: #ffffff;
    box-shadow: 0 12px 22px rgba(0,0,0,.35);
  }

  .google-btn svg{ width: 18px; height: 18px; flex-shrink: 0; }

  .signup{
    text-align: center;
    font-size: 13px;
    color: var(--cream-dim);
    animation-delay: .54s;
  }

  .signup a{
    color: var(--gold-bright);
    font-weight: 600;
    border-bottom: 1px solid var(--gold-dim);
  }

  @media (prefers-reduced-motion: reduce){
    .fall{ animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

  <div class="table-bg"></div>

  <div class="scene">
    <div class="card">
      <div class="brand-mark fall" aria-hidden="true"></div>
      <div class="brand-name fall">Binion's</div>
      <div class="brand-sub fall">SALON DE POKER</div>

      <div class="panel fall">
        <h1>Prenez place à la table</h1>
        <p class="lede">Créez votre compte pour rejoindre la partie</p>

        <a href="#inscription-google" class="google-btn">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.3-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 16.3 3 9.6 7.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 36.4 26.9 37 24 37c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 40.6 16.2 45 24 45z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.6 5.4C41.5 35.9 45 30.4 45 24c0-1.2-.1-2.3-.4-3.5z"/>
          </svg>
          S'inscrire avec Google
        </a>

        <div class="divider">OU</div>

        <form>
          <div class="field">
            <label for="pseudo">Pseudo <span class="req">*</span></label>
            <input type="text" id="pseudo" name="pseudo" placeholder="PokerFace_88" autocomplete="username" required>
          </div>

          <div class="field">
            <label for="email">Adresse e-mail <span class="req">*</span></label>
            <input type="email" id="email" name="email" placeholder="vous@exemple.com" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="password">Mot de passe <span class="req">*</span></label>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required minlength="8">
            <p class="hint">8 caractères minimum</p>
          </div>

          <label class="terms">
            <input type="checkbox" id="terms" name="terms" required>
            J'ai plus de 18 ans et j'accepte les <a href="#conditions">conditions d'utilisation</a>
          </label>

          <button type="submit" class="cta">Créer mon compte</button>
        </form>

        <p class="signup" style="margin:18px 0 0;">
          Déjà un compte ? <a href="#connexion">Connectez-vous</a>
        </p>
      </div>

      <p class="signup fall" style="margin-top:22px;">
        BINION'S · ÉTABLI EN 1951
      </p>
    </div>
  </div>

</body>
</html>
